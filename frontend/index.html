<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
    <title>frontend</title>
  </head>
  <body>
    <div class="game-container">
      <button id="start-game">Start the game</button>
      <div class="action-buttons">
        <div class="arduino-action">
          <button class="pass-btn" id="pass-action-arduino">
            Pass Arduion action
          </button>
          <select id="scene-select">
            <option value="PLAYER_DETECTED">Player detected</option>
            <option value="EAR_PRESSED">Ears</option>
            <option value="LIGHT_DETECTED">Eyes</option>
            <option value="NOSE_ROTATED">Nose</option>
          </select>
        </div>
        <button class="pass-btn" id="pass-action-speech">
          Pass Speech action
        </button>
      </div>
    </div>
    <div class="debug-container">
      <div class="debug-scene-paragraph">
        <p>La scène actuelle est :</p>
        <p id="current-scene"></p>
      </div>
      <div class="debug-audio-paragraph">
        <p>L'audio joué actuellement est :</p>
        <p id="current-audio"></p>
      </div>
    </div>

    <div class="debug-microphone">
      <p id="microphone-status"></p>
      <p id="element-word"></p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
